name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Exclude server API route from static export
        run: mv web/app/api /tmp/agrovani-api
      - name: Build static frontend
        env:
          GITHUB_PAGES: 'true'
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_LOCATION_WS_URL: ${{ vars.NEXT_PUBLIC_LOCATION_WS_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Restore server API route
        if: always()
        run: mv /tmp/agrovani-api web/app/api
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out
      - id: deployment
        uses: actions/deploy-pages@v4
